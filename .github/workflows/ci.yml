name: "ci"

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/react/**"
      - "packages/style/**"
      - "DESIGN.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @amerfathullah/myds-react
        run: pnpm build --filter=@amerfathullah/myds-react

      - name: Lint @amerfathullah/myds-react
        run: pnpm --filter @amerfathullah/myds-react lint

      - name: Check @amerfathullah/myds-react exports
        run: pnpm --filter @amerfathullah/myds-react check-exports

      - name: Type-check @amerfathullah/myds-react against React 18 and 19 types
        run: pnpm --filter @amerfathullah/myds-react check-types

      - name: Test @amerfathullah/myds-react
        run: pnpm --filter @amerfathullah/myds-react test

      - name: Install Chromium for the @amerfathullah/myds-style token-parity check
        run: pnpm --filter @amerfathullah/myds-style exec playwright install --with-deps --only-shell chromium

      - name: Test @amerfathullah/myds-style
        run: pnpm --filter @amerfathullah/myds-style test
