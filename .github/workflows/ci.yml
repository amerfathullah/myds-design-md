name: "ci"

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/react/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @govtechmy/myds-react
        run: pnpm build --filter=@govtechmy/myds-react

      - name: Lint @govtechmy/myds-react
        run: pnpm --filter @govtechmy/myds-react lint

      - name: Check @govtechmy/myds-react exports
        run: pnpm --filter @govtechmy/myds-react check-exports

      - name: Type-check @govtechmy/myds-react against React 18 and 19 types
        run: pnpm --filter @govtechmy/myds-react check-types
