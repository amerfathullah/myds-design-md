name: "ci"

# Every push to a branch runs the job. Pull requests into main trigger this too,
# but the job runs only for the Version Packages PR (#237). Its commits come from
# the `publish` workflow's GITHUB_TOKEN, which starts no push run, so this is its
# only CI, and GitHub holds it until a maintainer approves it. On every other PR
# the job is skipped, since the branch's push run covers it.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'changeset-release/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @amerfathullah/myds-react
        run: pnpm build --filter=@amerfathullah/myds-react

      - name: Lint @amerfathullah/myds-react
        run: pnpm --filter @amerfathullah/myds-react lint

      - name: Check @amerfathullah/myds-react exports
        run: pnpm --filter @amerfathullah/myds-react check-exports

      - name: Type-check @amerfathullah/myds-react against React 18 and 19 types
        run: pnpm --filter @amerfathullah/myds-react check-types

      - name: Test @amerfathullah/myds-react
        run: pnpm --filter @amerfathullah/myds-react test

      - name: Install Chromium for the @amerfathullah/myds-style token-parity, focus-ring-contrast, focused-segment, segment-clip, segment-scroll, field-states, input-states, label-states, search-bar-states, search-bar-wiring, search-bar-keys, search-bar-caret, search-bar-highlight, select-item-states, entry-rendering, focus-rings, switch, data-table, data-table-radio, data-table-widen, table-tooltip, cookie-banner, pill, callout, toast, summary-list, masthead-region, skip-link, select-dropdown-disabled, radio-disabled and accordion-disabled tests
        run: pnpm --filter @amerfathullah/myds-style exec playwright install --with-deps --only-shell chromium

      - name: Test @amerfathullah/myds-style
        run: pnpm --filter @amerfathullah/myds-style test
