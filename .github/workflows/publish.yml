name: "publish"

# The Changesets flow for @amerfathullah/myds-react and @amerfathullah/myds-style.
# A push to main opens or updates the "Version Packages" PR while changesets
# are pending, and publishes both packages to npm once that PR merges.
# A manual run is a dry run on any branch: it versions, builds and packs both
# packages as a release would, without publishing or pushing anything.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm version-packages
          pnpm build:packages
          pnpm changeset pack --out-dir "$RUNNER_TEMP/packed"
          pnpm exec attw "$RUNNER_TEMP"/packed/packages/amerfathullah-myds-react-*.tgz --profile node16

      # The Changesets action publishes when no changesets are pending
      - name: Check for the npm token
        if: github.event_name == 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name README.md)" ] && [ -z "$NPM_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret: an npm token that can publish @amerfathullah/myds-react and @amerfathullah/myds-style."
            exit 1
          fi

      - name: Open the version PR or publish
        if: github.event_name == 'push'
        uses: changesets/action@v1
        with:
          publish: pnpm release
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: true
